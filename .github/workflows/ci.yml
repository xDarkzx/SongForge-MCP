name: CI

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    # Matrix confirmed against real CI runs, not guessed: 3.12 is
    # excluded because basic-pitch pins tensorflow<2.15.1, and
    # TensorFlow never published a build in that range for Python 3.12
    # on any platform (its first 3.12-compatible release is 2.16) - a
    # hard upstream incompatibility, not something fixable here. 3.10
    # and 3.11 both confirmed green on ubuntu-latest and windows-latest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -x -q
