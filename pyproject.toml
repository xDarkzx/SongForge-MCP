[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "songforge-mcp"
version = "0.4.0"
description = "MCP server for local AI music generation via ACE-Step 1.5, with optional vocal/instrumental stem splitting"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded deliberately, not just habit: mcp 2.0.0 is a real,
    # confirmed breaking release (removed/restructured mcp.server.fastmcp,
    # which this whole project imports) that broke CI the same day it was
    # published, on a previously-passing commit that changed nothing
    # dependency-related - a fresh `pip install` alone was enough to pull
    # it in under the old unbounded ">=1.0.0" pin. Bump the ceiling only
    # after actually testing against a real 2.x release.
    "mcp[cli]>=1.0.0,<2.0.0",
    "playwright>=1.61.0",
    "yt-dlp>=2026.7.4",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "numpy>=1.26.4",
    "basic-pitch>=0.4.0",
    "psutil>=7.0.0",
]
keywords = ["mcp", "model-context-protocol", "claude", "ace-step", "music-generation", "ai-music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

[project.urls]
Homepage = "https://github.com/xDarkzx/SongForge-MCP"
Repository = "https://github.com/xDarkzx/SongForge-MCP"
Issues = "https://github.com/xDarkzx/SongForge-MCP/issues"
Changelog = "https://github.com/xDarkzx/SongForge-MCP/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
songforge-mcp = "songforge_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["songforge_mcp", "songforge_mcp_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
